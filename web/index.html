<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Terra Vox turns NASA Earth imagery into real-time, musically constrained sound so anyone, sighted or not, can hear how the planet is changing." />
    <meta name="theme-color" content="#060912" />
    <title>Terra Vox</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23101a33'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%2356B4E9' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23E69F00'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body>
    <a class="skip-link" href="#player">Skip to player</a>

    <header class="topbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="15" />
          <circle cx="16" cy="16" r="9" class="ring" />
          <circle cx="16" cy="16" r="3" class="dot" />
        </svg>
        <div>
          <h1>Terra Vox</h1>
          <p class="tagline">NASA Earth data you can hear</p>
        </div>
      </div>
    </header>

    <main id="panel-jukebox" class="layout">
      <section class="themes" aria-labelledby="themes-heading">
        <h2 id="themes-heading" class="section-title">Themes</h2>
        <div id="theme-tiles"></div>
      </section>

      <section id="player" class="player" aria-labelledby="player-heading" tabindex="-1">
        <h2 id="player-heading" class="section-title"><span id="player-theme">Wildfires</span></h2>

        <div id="stage" class="stage" data-mode="single">
          <figure class="deck deck-single">
            <div class="screen">
              <img id="frame-img" alt="" />
              <span class="year-badge" id="frame-year" aria-hidden="true"></span>
            </div>
            <figcaption id="frame-caption" class="frame-caption"></figcaption>
          </figure>
          <div class="record" aria-hidden="true"><img id="record-label" alt="" /></div>
        </div>

        <div class="transport" role="group" aria-label="Playback">
          <button id="prev" class="icon-btn" type="button" aria-label="Previous year" title="Previous year ( [ )">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z" /></svg>
          </button>
          <button id="play" class="play-btn" type="button" aria-label="Play">
            <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16l13-8z" /></svg>
            <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z" /></svg>
          </button>
          <button id="next" class="icon-btn" type="button" aria-label="Next year" title="Next year ( ] )">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l11-7z" /></svg>
          </button>
          <div class="scrubber">
            <label for="scrubber" class="scrubber-label">Timeline</label>
            <input id="scrubber" type="range" min="0" max="0" step="1" value="0" />
            <div class="scrubber-ends" aria-hidden="true"><span id="scrub-start"></span><span id="scrub-end"></span></div>
          </div>
        </div>
      </section>
    </main>

    <div id="sr-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

    <footer class="credits">
      Imagery: NASA GIBS / Worldview (MODIS, OMI, AIRS, JPL MEaSUREs). Cover art: NASA SVS Earth Information Center.
    </footer>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
